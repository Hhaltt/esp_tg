<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings</title><link rel="stylesheet" href="style.css"></head><body><div class="container"><nav><a href="/sd/">Home</a><a href="/sd/settings.html">Settings</a><a href="/sd/reminders.html">Reminders</a></nav><h1>Settings</h1><form id="settingsForm" class="card"><h2>System</h2><label>Device name</label><input name="deviceName"><label>Timezone</label><input name="timezone"><label>NTP server</label><input name="ntpServer"><h2>API and tokens</h2><label>Telegram bot token</label><input type="password" name="botToken"><label>Hub API key</label><input type="password" name="hubApiKey"><h2>Startup message</h2><label class="checkbox"><input type="checkbox" name="startupMessageEnabled">Send after startup</label><label>Message</label><textarea name="startupMessage" rows="4"></textarea><h2>GPIO 35</h2><label class="checkbox"><input type="checkbox" name="gpio35Enabled">Enable</label><label>Message HIGH</label><input name="gpio35HighMessage"><label>Message LOW</label><input name="gpio35LowMessage"><h2>GPIO 39</h2><label class="checkbox"><input type="checkbox" name="gpio39Enabled">Enable</label><label>Message HIGH</label><input name="gpio39HighMessage"><label>Message LOW</label><input name="gpio39LowMessage"><button>Save settings</button></form><div class="card"><h2>Telegram chats</h2><div id="chatList"></div><h3>Add chat</h3><form id="addChat"><label>Name</label><input name="name" required><label>Chat ID</label><input name="id" required><button>Add chat</button></form></div></div><script src="app.js"></script></body></html>

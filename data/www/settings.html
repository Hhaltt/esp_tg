<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Settings</title><link rel='stylesheet' href='/sd/style.css'></head><body data-page='settings'><main class='container' id='app'></main><div id='toast'></div><script src='/sd/app.js'></script><script>
(async()=>{for(let n=0;n<80;n++){const f=document.getElementById('settingsForm');if(f){try{const s=await fetch('/api/secrets',{cache:'no-store'}).then(r=>r.json());const sec=document.createElement('section');sec.className='card';sec.innerHTML=`<h2>API and tokens</h2><label>Telegram bot token<input type='password' name='botToken' autocomplete='off'></label><label>Hub API key<input type='password' name='hubApiKey' autocomplete='off'></label><p class='hint'>These values are stored in the hub configuration. Use the buttons to reveal or hide them.</p>`;f.insertBefore(sec,f.children[1]||null);sec.querySelector('[name=botToken]').value=s.botToken||'';sec.querySelector('[name=hubApiKey]').value=s.hubApiKey||'';return}catch(e){console.error(e);return}}await new Promise(r=>setTimeout(r,100))}})();
</script></body></html>

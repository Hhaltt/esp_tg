<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reminders</title><link rel="stylesheet" href="style.css"></head><body><div class="container"><nav><a href="/sd/">Home</a><a href="/sd/settings.html">Settings</a><a href="/sd/reminders.html">Reminders</a></nav><h1>Reminders</h1><div class="card"><h2 id="reminderTitle">My reminders</h2><div id="reminderList"></div></div><div class="card"><h2>Add reminder</h2><form id="reminderForm"><label>Message</label><textarea name="message" required></textarea><label>Chat</label><select name="chatId" id="chatSelect"></select><label>Repeat</label><select name="type" id="reminderType"><option value="once">Once</option><option value="daily">Every day</option><option value="weekly">Every week</option><option value="monthly">Every month</option><option value="yearly">Every year</option></select><div id="onceFields"><label>Date</label><input type="date" name="onceDate"></div><div id="weeklyFields" hidden><label>Weekday</label><select name="weekday"><option value="0">Sunday</option><option value="1">Monday</option><option value="2">Tuesday</option><option value="3">Wednesday</option><option value="4">Thursday</option><option value="5">Friday</option><option value="6">Saturday</option></select></div><div id="monthlyFields" hidden><label>Day of month</label><input type="number" name="monthlyDay" min="1" max="31" value="1"></div><div id="yearlyFields" hidden><label>Day</label><input type="number" name="yearlyDay" min="1" max="31" value="1"><label>Month</label><input type="number" name="yearlyMonth" min="1" max="12" value="1"></div><label>Time</label><input type="time" name="time" value="09:00" required><label class="checkbox"><input type="checkbox" name="silent">Send without sound</label><button>Add reminder</button></form></div></div><script src="app.js"></script></body></html>

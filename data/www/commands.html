<!doctype html><html lang='uk'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Commands</title><link rel='stylesheet' href='/sd/style.css'></head><body><main class='container'><nav><a href='/sd/'>Home</a><a href='/sd/settings.html'>Settings</a><a href='/sd/reminders.html'>Reminders</a><a href='/sd/commands.html'>Commands</a></nav><h1>Command routes</h1><section class='card'><form id='f'><input type='hidden' name='index'><label>Human phrase<input name='phrase' placeholder='turn off the light' required></label><label>Device URL<input name='url' placeholder='http://192.168.88.20/api/v1/command' required></label><label>Device API key<input name='apiKey' type='password'></label><label>Device command<input name='command' placeholder='LIGHT_OFF' required></label><button>Save</button><button type='button' id='cancel'>Cancel</button></form></section><section class='card'><h2>Routes</h2><div id='list'>Loading...</div></section></main><script>const f=document.getElementById('f'),list=document.getElementById('list');let items=[];async function req(url,data){const r=await fetch(url,{method:data?'POST':'GET',body:data?new URLSearchParams(data):undefined,cache:'no-store'});const j=await r.json();if(!r.ok||j.ok===false)throw new Error(j.message||'Request failed');return j}async function load(){try{items=(await req('/api/commands')).items||[];list.innerHTML=items.length?items.map(r=>`<article class='item'><div><b>${r.phrase}</b><br><small>${r.url} → ${r.command}</small></div><div class='actions'><button data-edit='${r.index}'>Edit</button><button data-delete='${r.index}'>Delete</button></div></article>`).join(''):'No command routes yet'}catch(e){list.textContent=e.message}}function reset(){f.reset();f.index.value=''}list.onclick=async e=>{const i=e.target.dataset.edit??e.target.dataset.delete;if(i===undefined)return;const r=items.find(x=>String(x.index)===String(i));if(e.target.dataset.edit!==undefined){f.index.value=r.index;f.phrase.value=r.phrase;f.url.value=r.url;f.apiKey.value='';f.command.value=r.command;f.scrollIntoView({behavior:'smooth'})}else if(confirm('Delete this command route?')){try{await req('/commands/delete',{index:i});await load()}catch(err){alert(err.message)}}};f.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f).entries());try{await req(d.index?'/commands/edit':'/commands/add',d);reset();await load()}catch(err){alert(err.message)}};document.getElementById('cancel').onclick=reset;load()</script></body></html>

<!doctype html><html lang='uk'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Commands</title><link rel='stylesheet' href='/sd/style.css'></head><body><main class='container'><nav><a href='/sd/'>Головна</a> · <a href='/sd/settings.html'>Налаштування</a> · <a href='/sd/reminders.html'>Нагадування</a></nav><section class='card'><h1>Трансляція команд</h1><p>Людська фраза → HTTP-команда іншому пристрою.</p><form id='f'><input type='hidden' name='index'><label>Фраза<input name='phrase' placeholder='вимкни світло' required></label><label>URL<input name='url' placeholder='http://192.168.88.20/api/v1/command' required></label><label>API key<input name='apiKey' type='password'></label><label>Команда<input name='command' placeholder='LIGHT_OFF' required></label><button>Зберегти</button><button type='button' onclick='f.reset()'>Скасувати</button></form></section><section class='card'><h2>Маршрути</h2><div id='list'>Завантаження…</div></section></main><script>const f=document.getElementById('f'),list=document.getElementById('list');let items=[];async function load(){items=(await fetch('/api/commands').then(r=>r.json())).items||[];list.innerHTML=items.length?items.map(r=>`<p><b>${r.phrase}</b><br><small>${r.url} → ${r.command}</small><br><button onclick='edit(${r.index})'>Редагувати</button> <button onclick='del(${r.index})'>Видалити</button></p>`).join(''):'Маршрутів ще нема';}function edit(i){let r=items.find(x=>x.index==i);f.index.value=r.index;f.phrase.value=r.phrase;f.url.value=r.url;f.apiKey.value='';f.command.value=r.command;}async function del(i){if(!confirm('Видалити?'))return;await fetch('/commands/delete',{method:'POST',body:new URLSearchParams({index:i})});load();}f.onsubmit=async e=>{e.preventDefault();let url=f.index.value?'/commands/edit':'/commands/add';let r=await fetch(url,{method:'POST',body:new URLSearchParams(new FormData(f))}).then(r=>r.json());if(!r.ok)return alert(r.message);f.reset();load();};load();</script></body></html>
